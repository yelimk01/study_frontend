<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관광지 조회 | EnjoyTrip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="visually-hidden-focusable" href="#main">본문으로 이동</a>
<header class="border-bottom bg-white">
  <nav class="container d-flex flex-wrap align-items-center gap-3 py-3" aria-label="주 메뉴">
    <a class="navbar-brand fw-bold text-primary me-auto" href="index.html">EnjoyTrip</a>
    <a href="attractions.html">관광지 조회</a>
    <a href="signup.html">회원가입</a>
    <a href="login.html">로그인</a>
    <a href="profile.html">회원정보</a>
  </nav>
</header>
<main id="main" class="container py-4">
  <p class="text-secondary small">개발용 페이지 틀 · 기능 미구현</p>
  <h1 class="h3 mb-4">관광지 조회</h1>
<form id="search-form" class="row g-3 mb-4">
<div class="col-12 col-md-4"><label class="form-label" for="area-code">지역</label>
<select id="area-code" class="form-select"><option value="">지역 선택 (데이터 연결 예정)</option></select></div>
<div class="col-12 col-md-5"><label class="form-label" for="content-type">관광 유형</label>
<select id="content-type" class="form-select">
<option value="">전체</option><option value="12">관광지</option><option value="32">숙박</option>
<option value="39">음식점</option><option value="14">문화시설</option><option value="15">공연·행사</option>
<option value="25">여행코스</option><option value="38">쇼핑</option></select></div>
<div class="col-12 col-md-3 d-flex align-items-end"><button type="button" id="search-button" class="btn btn-primary w-100" disabled>조회</button></div>
</form>
<div class="row g-4">
<section class="col-12 col-lg-7" aria-labelledby="results-title"><h2 id="results-title" class="h5">조회 결과</h2>
<p id="search-status" role="status">관광지 데이터 표시 영역입니다. 아직 구현되지 않았습니다.</p>
<div id="attraction-list" class="row g-3"><!-- TODO: 관광지 카드를 DOM으로 추가 --></div></section>
<section class="col-12 col-lg-5" aria-labelledby="map-title"><h2 id="map-title" class="h5">지도</h2>
<div id="map" class="placeholder-box">지도 연동 영역 (미구현)</div></section>
</div>
  <p id="page-message" class="mt-3" role="status"></p>
</main>
<footer class="container py-3 border-top text-secondary small">EnjoyTrip · Web(Front) PJT</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/attractions.js"></script>
</body>
</html>

<body>
<a class="visually-hidden-focusable" href="#main">본문으로 이동</a>
<header class="border-bottom bg-white">
  <nav class="container d-flex flex-wrap align-items-center gap-3 py-3" aria-label="주 메뉴">
    <a class="navbar-brand fw-bold text-primary me-auto" href="index.html">EnjoyTrip</a>

<main id="main" class="container py-4" data-board="board"><h1 class="h3 mb-4">공유게시판</h1><p class="text-secondary">누구나 조회할 수 있고 로그인한 회원은 글을 작성할 수 있습니다. 수정·삭제는 작성자에게 제공됩니다.</p><form id="search-form" class="d-flex gap-2 mb-3"><label class="visually-hidden" for="query">제목 및 내용 검색</label><input id="query" class="form-control" placeholder="제목 및 내용 검색" maxlength="100"><button class="btn btn-outline-primary" type="submit">검색</button></form><button id="new-post" class="btn btn-primary mb-3" type="button">글쓰기</button><section id="post-list" aria-label="게시글 목록"></section><section id="post-detail" class="card card-body mt-3" hidden></section><form id="post-form" class="card card-body mt-3" hidden><h2 id="editor-title" class="h5">글 작성</h2><label for="post-title" class="form-label">제목</label><input id="post-title" class="form-control mb-3" required maxlength="100"><label for="post-content" class="form-label">내용</label><textarea id="post-content" class="form-control mb-3" rows="8" required maxlength="10000"></textarea><div class="d-flex gap-2"><button class="btn btn-primary" type="submit">저장</button><button id="cancel-edit" class="btn btn-secondary" type="button">취소</button></div></form><p id="page-message" role="status" class="mt-3"></p></main>
<footer class="container py-3 border-top text-secondary small">EnjoyTrip · Web(Front) PJT</footer>

<script src="js/community.js"></script>

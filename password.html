<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 찾기 | EnjoyTrip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/travel.css" rel="stylesheet">
</head>
<body class="travel-page member-page">
<a class="visually-hidden-focusable" href="#main">본문으로 이동</a>
<header class="border-bottom bg-white">
  <nav class="container d-flex flex-wrap align-items-center gap-3 py-3" aria-label="주 메뉴">
    <a class="navbar-brand fw-bold text-primary me-auto" href="index.html">EnjoyTrip</a>
    <a href="attractions.html">관광지 조회</a>
    <a href="signup.html">회원가입</a>
    <a href="login.html">로그인</a>
    <a href="profile.html">회원정보</a>
  </nav>
</header>
<main id="main" class="container py-4">
  <p class="text-secondary small">EnjoyTrip · 회원 서비스</p>
  <h1 class="h3 mb-4">비밀번호 찾기</h1><form id="page-form" class="card card-body form-panel"><div class="mb-3"><label class="form-label" for="user-id">아이디</label><input class="form-control" id="user-id" name="user-id" type="text" autocomplete="username" required maxlength="100"></div><div class="mb-3"><label class="form-label" for="email">가입 이메일</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required maxlength="100"></div><div class="d-flex flex-wrap gap-2"><button id="submit-button" class="btn btn-primary" type="submit">확인</button></div></form>
  <p class="small text-secondary">수업용 재설정 시연입니다. 실제 이메일 인증은 제공하지 않습니다.</p><form id="reset-form" class="card card-body form-panel mt-3" hidden><label for="new-password" class="form-label">새 비밀번호 (영문·숫자 포함 8~64자)</label><input id="new-password" class="form-control mb-3" type="password" autocomplete="new-password" required minlength="8" maxlength="64"><label for="new-password-confirm" class="form-label">새 비밀번호 확인</label><input id="new-password-confirm" class="form-control mb-3" type="password" autocomplete="new-password" required maxlength="64"><button class="btn btn-primary" type="submit">비밀번호 변경</button></form><p id="page-message" class="mt-3" role="status"></p>
</main>
<footer class="container py-3 border-top text-secondary small">EnjoyTrip · Web(Front) PJT</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/password.js"></script>
</body>
</html>

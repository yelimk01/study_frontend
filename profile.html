<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원정보 | EnjoyTrip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/travel.css" rel="stylesheet">
</head>
<body class="travel-page member-page">
<a class="visually-hidden-focusable" href="#main">본문으로 이동</a>
<header class="border-bottom bg-white">
  <nav class="container d-flex flex-wrap align-items-center gap-3 py-3" aria-label="주 메뉴">
    <a class="navbar-brand fw-bold text-primary me-auto" href="index.html">EnjoyTrip</a>
    <a href="attractions.html">관광지 조회</a>
    <a href="signup.html">회원가입</a>
    <a href="login.html">로그인</a>
    <a href="profile.html" aria-current="page">회원정보</a>
  </nav>
</header>
<main id="main" class="container py-4">
  <p class="text-secondary small">EnjoyTrip · 회원 서비스</p>
  <h1 class="h3 mb-4">회원정보</h1><form id="page-form" class="card card-body form-panel"><div class="mb-3"><label class="form-label" for="user-id">아이디</label><input class="form-control" readonly id="user-id" name="user-id" type="text" required maxlength="100"></div><div class="mb-3"><label class="form-label" for="name">이름</label><input class="form-control" id="name" name="name" type="text" autocomplete="name" required maxlength="100"></div><div class="mb-3"><label class="form-label" for="email">이메일</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required maxlength="100"></div><div class="d-flex flex-wrap gap-2"><button id="update-button" class="btn btn-primary" type="submit">수정</button><button id="logout-button" class="btn btn-outline-secondary" type="button">로그아웃</button><button id="delete-button" class="btn btn-outline-danger" type="button">탈퇴</button></div></form><div id="delete-modal" class="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title" hidden><div class="card card-body form-panel"><h2 id="delete-modal-title" class="h5">회원 탈퇴</h2><p>회원정보가 삭제됩니다. 작성한 게시글은 유지됩니다. 탈퇴하시겠습니까?</p><div class="d-flex gap-2"><button id="cancel-delete-button" class="btn btn-secondary" type="button">취소</button><button id="confirm-delete-button" class="btn btn-danger" type="button">탈퇴</button></div></div></div>
  <p id="page-message" class="mt-3" role="status"></p>
</main>
<footer class="container py-3 border-top text-secondary small">EnjoyTrip · Web(Front) PJT</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/profile.js"></script>
</body>
</html>

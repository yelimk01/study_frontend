<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | EnjoyTrip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="visually-hidden-focusable" href="#main">본문으로 이동</a>
<header class="border-bottom bg-white">
  <nav class="container d-flex flex-wrap align-items-center gap-3 py-3" aria-label="주 메뉴">
    <a class="navbar-brand fw-bold text-primary me-auto" href="index.html">EnjoyTrip</a>
    <a href="attractions.html">관광지 조회</a>
    <a href="signup.html">회원가입</a>
    <a href="login.html">로그인</a>
    <a href="profile.html">회원정보</a>
  </nav>
</header>
<main id="main" class="container py-4">
  <p class="text-secondary small">개발용 페이지 틀 · 기능 미구현</p>
  <h1 class="h3 mb-4">회원가입</h1><form id="page-form" class="card card-body form-panel"><div class="mb-3"><label class="form-label" for="user-id">아이디</label><input class="form-control" id="user-id" name="user-id" type="text" autocomplete="username"></div><div class="mb-3"><label class="form-label" for="name">이름</label><input class="form-control" id="name" name="name" type="text" autocomplete="name"></div><div class="mb-3"><label class="form-label" for="email">이메일</label><input class="form-control" id="email" name="email" type="email" autocomplete="email"></div><div class="mb-3"><label class="form-label" for="password">비밀번호</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password"></div><div class="mb-3"><label class="form-label" for="password-confirm">비밀번호 확인</label><input class="form-control" id="password-confirm" name="password-confirm" type="password" autocomplete="new-password"></div><div class="d-flex flex-wrap gap-2"><button id="submit-button" class="btn btn-primary" type="button" disabled>회원가입</button></div></form>
  <p id="page-message" class="mt-3" role="status"></p>
</main>
<footer class="container py-3 border-top text-secondary small">EnjoyTrip · Web(Front) PJT</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
